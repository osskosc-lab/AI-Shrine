name: Phase 2.3 Debug and Upstream Qualification

on:
  pull_request:
    paths:
      - "experiments/bellsync/phase2_3/**"
      - ".github/workflows/phase2_3_debug_qualification.yml"
  push:
    branches:
      - "feat/bellsync-phase2-3-debug-qualification"
      - "feat/bellsync-phase2-3-upstream-provenance"

permissions:
  contents: read

jobs:
  deterministic-debug-and-upstream-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deterministic dependency
        run: python -m pip install numpy==2.1.1

      - name: P23-D0 through P23-D5
        working-directory: experiments/bellsync/phase2_3
        run: |
          python -m unittest -v test_p23_debug.py
          python p23_debug.py

      - name: P23-P0 upstream provenance verification
        working-directory: experiments/bellsync/phase2_3
        run: |
          python -m unittest -v test_p23_upstream.py
          python p23_upstream.py
